{%- comment -%}
  FAQPage and HowTo Schema.org structured data from post front matter.
{%- endcomment -%}

{% if page.faq and page.faq.size > 0 %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {% for item in page.faq %}
    {
      "@type": "Question",
      "name": {{ item.question | jsonify }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ item.answer | jsonify }}
      }
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
}
</script>
{% endif %}

{% if page.how_to %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "HowTo",
  "name": {{ page.how_to.name | jsonify }}{% if page.how_to.total_time %},
  "totalTime": {{ page.how_to.total_time | jsonify }}{% endif %}{% if page.how_to.steps and page.how_to.steps.size > 0 %},
  "step": [
    {% for step in page.how_to.steps %}
    {
      "@type": "HowToStep",
      "position": {{ forloop.index }},
      "name": {{ step.name | jsonify }},
      "text": {{ step.text | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]{% endif %}
}
</script>
{% endif %}
